<style>
.chat-ai {

  background: rgba(0, 0, 0, .65);

  justify-content: center;

}

.chat-box {
  width: min(600px, 92%);
  height: 700px;
  max-height: 90vh;
  background: rgba(10, 12, 30, .95);
  border: 1px solid rgba(88, 101, 242, .6);
  border-radius: 24px;
  box-shadow: 0 0 40px rgba(88, 101, 242, .35);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.chat-header {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.ai-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.ai-icon {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #5865F2;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px rgba(88,101,242,.7);
}

.ai-title h3 {
  margin: 0;
  color: white;
}

.ai-online {
  color: #43ff88;
  font-size: 12px;
}

.close-chat {
  background: transparent;
  border: none;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

.chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
}

.message {
  margin-bottom: 12px;
  padding: 12px 15px;
  border-radius: 15px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-line;
}

.bot-message {
  background: rgba(88,101,242,.18);
  color: #fff;
  border: 1px solid rgba(88,101,242,.25);
}

.user-message {
  background: rgba(255,255,255,.08);
  color: white;
  margin-left: auto;
}

.question-list {
  padding: 10px 20px;
  max-height: 150px;
  overflow-y: auto;
  border-top: 1px solid rgba(255,255,255,.06);
}

.question-btn {
  width: 100%;
  text-align: right;
  margin-bottom: 7px;
  padding: 9px 12px;
  border-radius: 10px;
  border: 1px solid rgba(88,101,242,.25);
  background: rgba(88,101,242,.08);
  color: white;
  cursor: pointer;
  transition: .2s;
}

.question-btn:hover {
  background: rgba(88,101,242,.25);
  transform: translateX(-3px);
}

.chat-input-area {
  padding: 15px;
  display: flex;
  gap: 10px;
  border-top: 1px solid rgba(255,255,255,.08);
}

.chat-input {
  flex: 1;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  color: white;
  outline: none;
  border-radius: 12px;
  padding: 12px;
}

.chat-send {
  width: 50px;
  border: none;
  border-radius: 12px;
  background: #5865F2;
  color: white;
  cursor: pointer;
  font-size: 18px;
}

.chat-send:hover {
  background: #4752c4;
}
</style>


<div class="chat-ai" id="chatAI">

  <div class="chat-box">

  </div>

</div>

/* ================= CHAT FUNCTIONS ================= */

function openChat() {
  document.getElementById("chatAI").style.display = "flex";
  document.getElementById("chatInput").focus();
}

function closeChat() {
  document.getElementById("chatAI").style.display = "none";
}


const questionList = document.getElementById("questionList");

discordQuestions.forEach((item, index) => {

  const button = document.createElement("button");

  button.className = "question-btn";

  button.textContent = `${index + 1}. ${item.q}`;

  button.onclick = () => {

    addMessage(item.q, "user");

    setTimeout(() => {
      addMessage(item.a, "bot");
    }, 300);

  };

  questionList.appendChild(button);

});


function addMessage(text, type) {

  const messages = document.getElementById("chatMessages");

  const message = document.createElement("div");

  message.className =
    "message " +
    (type === "user" ? "user-message" : "bot-message");

  message.textContent = text;

  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;
}


function sendChat() {

  const input = document.getElementById("chatInput");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";


  /* Search the 100 Discord questions */

  const found = discordQuestions.find(item =>
    item.q.toLowerCase() === text.toLowerCase()
  );


  if (found) {

    setTimeout(() => {
      addMessage(found.a, "bot");
    }, 300);

    return;
  }


  /* Search by keywords */

  const words = text
    .toLowerCase()
    .split(" ")
    .filter(word => word.length > 2);


  let bestMatch = null;
  let bestScore = 0;


  discordQuestions.forEach(item => {

    const question = item.q.toLowerCase();

    let score = 0;

    words.forEach(word => {

      if (question.includes(word)) {
        score++;
      }

    });

    if (score > bestScore) {
      bestScore = score;
      bestMatch = item;
    }

  });


  setTimeout(() => {

    if (bestMatch && bestScore > 0) {

      addMessage(bestMatch.a, "bot");

    } else {

      addMessage(
        "🤖 من فقط درباره Discord راهنمایی می‌کنم.\n\nمثلاً بپرس:\n«چطور Role بسازم؟»\nیا\n«چرا میکروفون Discord کار نمی‌کنه؟»",
        "bot"
      );

    }

  }, 400);

}



/* Enter = Send */

document.getElementById("chatInput").addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {
      sendChat();
    }

  }
);

</script>
