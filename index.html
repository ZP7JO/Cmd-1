<!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050510;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* نورهای آبی پس زمینه */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      z-index: -1;
    }

    body::before {
      background: #5865F2;
      top: -200px;
      left: -150px;
      animation: float1 8s ease-in-out infinite alternate;
    }

    body::after {
      background: #0077ff;
      bottom: -200px;
      right: -150px;
      animation: float2 10s ease-in-out infinite alternate;
    }

    @keyframes float1 {
      to {
        transform: translate(250px, 180px);
      }
    }

    @keyframes float2 {
      to {
        transform: translate(-250px, -180px);
      }
    }

    /* کارت */

    .card {
      position: absolute;

      width: 500px;
      padding: 70px 50px;

      text-align: center;

      background: rgba(15, 15, 30, 0.75);
      backdrop-filter: blur(20px);

      border-radius: 25px;

      box-shadow:
        0 0 40px rgba(88, 101, 242, 0.25);

      overflow: hidden;
    }

    /* موج نور دور کارت */

    .card::before {
      content: "";

      position: absolute;

      width: 180%;
      height: 180%;

      top: -40%;
      left: -40%;

      background: conic-gradient(
        transparent,
        transparent,
        transparent,
        #5865F2,
        #00aaff,
        transparent
      );

      animation: rotateLight 4s linear infinite;
    }

    .card::after {
      content: "";

      position: absolute;

      inset: 2px;

      background: rgba(10, 10, 20, 0.95);

      border-radius: 23px;

      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    /* کارت اول */

    .card-one {
      animation: firstCard 1s ease-in-out 4s forwards;
    }

    .discord {
      font-size: 80px;
      color: #5865F2;

      filter:
        drop-shadow(0 0 10px #5865F2)
        drop-shadow(0 0 25px #5865F2);

      animation:
        spin 2s ease-in-out 1,
        blink 0.5s ease-in-out 1 2s;
    }

    .welcome {
      font-size: 45px;
      margin: 25px 0 0;

      opacity: 0;

      text-shadow:
        0 0 10px #5865F2,
        0 0 25px #5865F2;

      animation:
        showWelcome 0.7s ease forwards 2.5s;
    }

    /* کارت دوم */

    .card-two {
      transform: translateX(120vw);
      animation: secondCard 1s ease-in-out 4s forwards;
    }

    .iranian-title {
      font-size: 36px;
      margin: 0;

      text-shadow:
        0 0 10px #5865F2,
        0 0 25px #5865F2;
    }

    .iranian-text {
      font-size: 20px;
      margin-top: 15px;
      opacity: 0.8;
    }

    /* انیمیشن کارت ها */

    @keyframes firstCard {
      to {
        transform: translateX(-120vw);
      }
    }

    @keyframes secondCard {
      to {
        transform: translateX(0);
      }
    }

    /* چرخش نور */

    @keyframes rotateLight {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* چرخش Discord */

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* چشمک */

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* ظاهر شدن Welcome */

    @keyframes showWelcome {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

  </style>

</head>

<body>

  <!-- کارت اول -->

  <div class="card card-one">

    <div class="content">

      <i class="fab fa-discord discord"></i>

      <h1 class="welcome">
        Welcome
      </h1>

    </div>

  </div>


  <!-- کارت دوم -->

  <div class="card card-two">

    <div class="content">

      <h1 class="iranian-title">
        Welcome to Iranian Discord
      </h1>

      <p class="iranian-text">
        Welcome to our community 🇮🇷
      </p>

    </div>

  </div>

</body>
</html>
