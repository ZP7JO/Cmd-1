  <!DOCTYPE html>
<html>
<head>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    .box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 200px;
      gap: 15px;
    }

    .discord {
      font-size: 80px;
      color: #5865F2;
      animation:
        spin 2s ease-in-out 1,
        blink 0.5s ease-in-out 1 2s;
    }

    .soon {
      font-size: 45px;
      opacity: 0;
      animation: show 0.5s ease forwards 2.5s;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    @keyframes show {
      to {
        opacity: 1;
      }
    }
  </style>

</head>

<body>

  <div class="box">
    <i class="fab fa-discord discord"></i>
    <span class="soon">Soon...</span>
  </div>

</body>
