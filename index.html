<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Iranian Discord</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #050509;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* ================= BACKGROUND ================= */

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .35;
      z-index: -1;
    }

    body::before {
      background: #5865F2;
      top: -200px;
      left: -150px;
      animation: float1 8s ease-in-out infinite alternate;
    }

    body::after {
      background: #0077ff;
      bottom: -200px;
      right: -150px;
      animation: float2 10s ease-in-out infinite alternate;
    }

    @keyframes float1 {
      from {
        transform: translate(0,0);
      }

      to {
        transform: translate(250px,200px);
      }
    }

    @keyframes float2 {
      from {
        transform: translate(0,0);
      }

      to {
        transform: translate(-250px,-200px);
      }
    }

    /* ================= CARDS ================= */

    .card {
      position: absolute;

      width: 500px;
      max-width: 90%;

      padding: 70px 50px;

      text-align: center;

      background: rgba(15,15,30,.75);

      backdrop-filter: blur(20px);

      border-radius: 25px;

      box-shadow: 0 0 40px rgba(88,101,242,.25);

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      width: 180%;
      height: 180%;

      top: -40%;
      left: -40%;

      background:
        conic-gradient(
          transparent,
          transparent,
          transparent,
          #5865F2,
          #00aaff,
          transparent
        );

      animation: rotateLight 4s linear infinite;
    }

    .card::after {
      content: "";

      position: absolute;

      inset: 2px;

      background: rgba(10,10,20,.95);

      border-radius: 23px;

      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
    }

    @keyframes rotateLight {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* ================= FIRST CARD ================= */

    .card-one {
      top: 50%;
      left: 50%;

      transform: translate(-50%,-50%);

      animation:
        firstCard 1s ease-in-out 4s forwards;
    }

    .card-two {
      top: 50%;
      left: 50%;

      transform: translate(120vw,-50%);

      animation:
        secondCard 1s ease-in-out 4s forwards;
    }

    @keyframes firstCard {
      to {
        transform: translate(-120vw,-50%);
      }
    }

    @keyframes secondCard {
      to {
        transform: translate(-50%,-50%);
      }
    }

    /* ================= DISCORD ICON ================= */

    .discord {
      font-size: 80px;

      color: #5865F2;

      animation:
        spin 2s ease-in-out 1,
        blink .5s ease-in-out 1 2s;
    }

    @keyframes spin {
      from {
        transform: rotate(0);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }

    }

    .welcome {
      font-size: 45px;

      margin: 0;

      opacity: 0;

      animation:
        showWelcome .7s ease forwards 2.5s;
    }

    @keyframes showWelcome {

      from {
        opacity: 0;
        transform: translateX(-20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }

    }

    /* ================= SECOND CARD ================= */

    .iranian-title {
      font-size: 36px;

      margin: 0;

      text-shadow:
        0 0 10px #5865F2,
        0 0 25px #5865F2;
    }

    .iranian-text {
      font-size: 20px;

      margin-top: 15px;

      opacity: .8;
    }

    /* ================= MENU ================= */

    .menu-card {
      margin-top: 30px;

      padding: 22px;

      background: rgba(15,15,30,.85);

      border: 1px solid rgba(88,101,242,.35);

      border-radius: 20px;

      box-shadow:
        0 0 25px rgba(88,101,242,.2);

      text-align: center;
    }

    .menu-card h2 {
      margin-top: 0;

      color: #5865F2;

      font-size: 26px;

      text-shadow:
        0 0 10px #5865F2;
    }

    /* ================= BUTTONS ================= */

    .menu-button,
    .service-button {
      display: block;

      width: 100%;

      margin: 8px 0;

      padding: 12px;

      border: none;

      border-radius: 10px;

      background: #5865F2;

      color: white;

      font-size: 16px;

      cursor: pointer;

      transition: .3s;
    }

    .menu-button:hover,
    .service-button:hover {
      transform: scale(1.03);

      box-shadow:
        0 0 18px rgba(88,101,242,.7);
    }

    /* ================= SERVICES ================= */

    .services-card {
      margin-top: 20px;

      padding: 22px;

      background: rgba(15,15,30,.85);

      border: 1px solid rgba(88,101,242,.35);

      border-radius: 20px;

      box-shadow:
        0 0 25px rgba(88,101,242,.2);

      text-align: center;
    }

    .services-card h2 {
      margin-top: 0;

      color: #5865F2;

      font-size: 26px;

      text-shadow:
        0 0 10px #5865F2;
    }

    .service-button i {
      margin-right: 8px;
    }

    /* ================= ABOUT ================= */

    .guide {
      display: none;

      position: fixed;

      top: 50%;
      left: 50%;

      transform: translate(-50%,-50%);

      width: 85%;
      max-width: 700px;

      max-height: 80vh;

      overflow-y: auto;

      padding: 30px;

      background: rgba(10,10,20,.98);

      color: white;

      border: 1px solid #5865F2;

      border-radius: 20px;

      box-shadow:
        0 0 40px rgba(88,101,242,.6);

      z-index: 1000;

      text-align: center;
    }

    .guide h2 {
      color: #5865F2;

      text-align: center;

      font-size: 32px;
    }

    .guide p {
      line-height: 1.8;

      font-size: 16px;
    }

    .close-button {
      padding: 10px 25px;

      border: none;

      border-radius: 10px;

      background: #5865F2;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    /* ================= FOOTER ================= */

    .developer {
      position: fixed;

      bottom: 12px;

      left: 50%;

      transform: translateX(-50%);

      color: rgba(255,255,255,.6);

      font-size: 14px;

      z-index: 50;

      text-align: center;
    }

    .developer span {
      color: #5865F2;

      text-shadow:
        0 0 8px #5865F2;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 600px) {

      .card {
        padding: 50px 25px;
      }

      .welcome {
        font-size: 35px;
      }

      .iranian-title {
        font-size: 28px;
      }

      .menu-card,
      .services-card {
        padding: 18px;
      }

    }

  </style>
</head>


<body>

  <!-- ================= FIRST CARD ================= -->

  <div class="card card-one">

    <div class="content">

      <i class="fa-brands fa-discord discord"></i>

      <h1 class="welcome">
        Welcome
      </h1>

    </div>

  </div>


  <!-- ================= SECOND CARD ================= -->

  <div class="card card-two">

    <div class="content">

      <h1 class="iranian-title">
        Welcome to Iranian Discord
      </h1>

      <p class="iranian-text">
        Welcome to our community 🇮🇷
      </p>


      <!-- ================= MENU ================= -->

      <div class="menu-card">

        <h2>
          Menu
        </h2>

        <button
          class="menu-button"
          onclick="showAbout()">

          About Us

        </button>

      </div>


      <!-- ================= SERVICES ================= -->

      <div class="services-card">

        <h2>
          Services
        </h2>

        <button class="service-button">

          <i class="fa-solid fa-server"></i>

          Server Creation

        </button>


        <button class="service-button">

          <i class="fa-solid fa-robot"></i>

          Bot Creation

        </button>


        <button class="service-button">

          <i class="fa-solid fa-gem"></i>

          Nitro Purchase

        </button>

      </div>

    </div>

  </div>


  <!-- ================= ABOUT US ================= -->

  <div id="about" class="guide">

    <h2>
      About Us
    </h2>

    <p>
      Developer : hoseinzp7
    </p>

    <p>
      ID Discord : hoseinzp7
    </p>

    <p>
      ID Discord : hoseinzp
    </p>

    <br>

    <button
      class="close-button"
      onclick="hideAbout()">

      Close

    </button>

  </div>


  <!-- ================= DEVELOPER ================= -->

  <div class="developer">

    Developer :
    <span>hoseinzp7</span>

  </div>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    function showAbout() {

      document
        .getElementById("about")
        .style.display = "block";

    }


    function hideAbout() {

      document
        .getElementById("about")
        .style.display = "none";

    }

  </script>

</body>
</html>
