<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    .discord {
      font-size: 90px;
      color: #5865F2;
      animation: spin 2s ease-in-out 1,
                 blink 0.5s ease-in-out 1 2s;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    .container {
      text-align: center;
      margin-top: 150px;
      font-size: 50px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div>Soon...</div>

    <i class="fab fa-discord discord"></i>
  </div>

</body>
</html>
